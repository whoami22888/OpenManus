name: Manus Workspace Integration
on:
  pull_request:
    paths:
      - 'manus_app/**'
      - 'tests/test_workspace.py'
      - 'requirements-workspace.txt'
      - '.github/workflows/manus-workspace.yml'
  push:
    branches: [main]
    paths:
      - 'manus_app/**'
      - 'tests/test_workspace.py'
      - 'requirements-workspace.txt'
permissions:
  contents: read
jobs:
  workspace-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checkout matches reviewed commit
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install app and test dependencies
        run: python -m pip install -r requirements-workspace.txt pytest httpx
      - name: Backend regression tests
        run: PYTHONPATH=. python -m pytest -q tests/test_workspace.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend syntax validation
        run: node --check manus_app/static/app.js
