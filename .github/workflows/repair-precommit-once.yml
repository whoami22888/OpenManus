name: One-time pre-commit format repair
on:
  push:
    branches: [feat/manus-integrated-app]
    paths:
      - '.github/workflows/repair-precommit-once.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'whoami22888/OpenManus' && github.ref == 'refs/heads/feat/manus-integrated-app'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical hook runner
        run: python -m pip install pre-commit
      - name: Apply same repository hooks to a fixed point
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            echo "Pre-commit formatting pass ${attempt}"
            if pre-commit run --all-files; then
              echo "All hooks clean"
              break
            fi
          done
          pre-commit run --all-files
      - name: Capture and commit exact formatter output
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-precommit-once.yml
          git diff --binary > /tmp/precommit-working-tree.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'style: apply existing pre-commit hooks without changing gates'
          git push origin "HEAD:refs/heads/feat/manus-integrated-app"
