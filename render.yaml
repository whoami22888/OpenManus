# Manus Hybrid staging only. No paid resources or model-provider credits.
# The Render free instance cannot launch Docker/Daytona cloud computers.
services:
  - type: web
    name: manus-hybrid-workspace
    runtime: python
    plan: free
    region: singapore
    repo: https://github.com/whoami22888/OpenManus
    branch: feat/manus-integrated-app
    autoDeployTrigger: off
    buildCommand: pip install -r requirements-workspace.txt
    startCommand: uvicorn manus_app.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.9"
      - key: MANUS_PUBLIC_MODE
        value: "1"
      - key: MANUS_APP_TOKEN
        generateValue: true
      - key: MANUS_DATA_DIR
        value: /tmp/manus-workspace
      - key: MANUS_DAYTONA_SPEND_APPROVED
        value: "0"
